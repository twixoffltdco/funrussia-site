<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUN RUSSIA | Донат</title><link rel="stylesheet" href="../css/main.css"></head><body class="page__body"><main class="donate-page"><div class="donate-shell"><div class="donate-card"><h1>Добровольный <span class="accent">донат</span></h1><p>Введите Nick_Name персонажа и сумму. 1 ₽ = 10 единиц доната. После создания заказа вы перейдёте на защищённую платёжную страницу YooMoney.</p><form class="donate-form" method="post" action="create_payment.php" autocomplete="off"><label>Nick_Name<input name="nickname" maxlength="64" required="" pattern="[A-Za-zА-Яа-яЁё0-9_-]+" placeholder="Например: Name_Surname"></label><label>Сумма, ₽<input name="amount" type="number" min="1" max="100000" step="1" required="" placeholder="500"><small>Вы получите: <strong id="donate-preview">5000</strong> доната</small></label><button type="submit">Перейти к оплате</button><p class="donate-note">Проверьте Nick_Name и сумму перед оплатой. После подтверждения платежа YooMoney сервер автоматически начислит донат.</p></form><a class="donate-back" href="../index.htm">← Вернуться на сайт</a></div></div></main><script>const a=document.querySelector('input[name="amount"]'),p=document.getElementById('donate-preview');function u(){const n=Math.max(0,Number(a.value||0));p.textContent=(n*10).toLocaleString('ru-RU')}a.addEventListener('input',u);u();</script></body></html>
